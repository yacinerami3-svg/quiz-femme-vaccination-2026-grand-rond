function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getOrder(q){
  if (!state.shuffles[q.id]){
    state.shuffles[q.id] = shuffleArray(q.options.map((_, i) => i));
  }
  return state.shuffles[q.id];
}

function fullList(){
  return QUESTIONS.concat([Q11]);
}

const app = document.getElementById("app");

function render(){

  if (state.screen === "poster") renderPoster();

  else if (state.screen === "quiz") renderQuiz();
  else if (state.screen === "bonus") renderBonus();
  else if (state.screen === "results") renderResults();
  app.classList.remove("fade-in");
  void app.offsetWidth; // force le redémarrage de l'animation
  app.classList.add("fade-in");
}

      </select>

      <label class="field-label">Exercez-vous dans le milieu médical ou paramédical ?</label>
      <select id="medical">
        <option value="">Choisir...</option>
        <option>Oui</option><option>Non</option>
      </select>

      <label class="field-label">Êtes-vous actuellement enceinte ?</label>
      <select id="enceinte">
        <option value="">Choisir...</option>
        <option>Oui</option><option>Non</option><option>Non concerné(e)</option>
      </select>
    </div>
    <button class="btn" id="next">Continuer</button>
  `;
  ["age","genre","profession","etudes","medical","enceinte"].forEach(k=>{
    document.getElementById(k).value = d[k] || "";
  });
  document.getElementById("next").onclick = () => {
    ["age","genre","profession","etudes","medical","enceinte"].forEach(k=>{
      d[k] = document.getElementById(k).value;
    });
    state.screen = "quiz";
    state.qIndex = 0;
    render();
  };
}

function renderQuestionCard(q, onAnswered, indexLabel, total){
  const already = state.answers[q.id];
  const order = getOrder(q); // ordre mélangé des index d'options, stable pour cette question/session

  app.innerHTML = `
    ${progressBar(indexLabel, total)}
    <div class="category-tag">${q.category}</div>
    ${q.intro ? `<div class="intro-quote">${q.intro}</div>` : ""}
    <div class="card">
      <p class="q-text">${q.text}</p>
      <div class="options" id="opts">
        ${order.map((origIndex)=>`<button class="opt" data-orig="${origIndex}">${q.options[origIndex]}</button>`).join("")}
      </div>
      <div id="explainWrap"></div>
    </div>
    <div class="row">
      <span></span>
      <button class="btn" id="nextBtn" disabled>Suivant</button>
    </div>
  `;
  const buttons = [...document.querySelectorAll(".opt")];
  const nextBtn = document.getElementById("nextBtn");

  function lockIn(origChoice){
    const isScored = typeof q.correct === "number";
    state.answers[q.id] = { choice: origChoice, correct: isScored ? origChoice === q.correct : null };
    buttons.forEach((b)=>{
      const orig = parseInt(b.dataset.orig);
      b.disabled = true;
      if (isScored){
        if (orig === q.correct) b.classList.add("correct");
        else if (orig === origChoice) b.classList.add("incorrect");
      } else if (orig === origChoice){
        b.classList.add("selected");
      }
    });
    if (q.explanation){
      document.getElementById("explainWrap").innerHTML = `<div class="explain">${q.explanation}</div>`;
    }
    nextBtn.disabled = false;
  }

  if (already){
    lockIn(already.choice);
  }

  buttons.forEach(b=>{
    b.onclick = () => lockIn(parseInt(b.dataset.orig));
  });
  nextBtn.onclick = onAnswered;
}

function renderQuiz(){
  const list = fullList();
  const q = list[state.qIndex];
  renderQuestionCard(q, () => {
    if (state.qIndex < list.length - 1){
      state.qIndex++;
    } else {
      // Décider si on propose les questions bonus (>= 56 ans)
      state.showBonus = state.demo.age === "56 et +";
      state.screen = state.showBonus ? "bonus" : "results";
      state.bonusIndex = 0;
    }
    render();
  }, state.qIndex + 1, list.length);
}

function renderBonus(){
  const q = BONUS_QUESTIONS[state.bonusIndex];
  app.innerHTML = "";
  const header = document.createElement("div");
  header.innerHTML = `<h2>Pour aller plus loin</h2><p class="muted">« Rester en bonne santé et en forme après 65 ans passe aussi par la vaccination. De nombreuses maladies infectieuses peuvent occasionner des complications d'autant plus importantes que l'on prend de l'âge ou que l'on est atteint de pathologie(s) chronique(s). Il est donc essentiel de se protéger en fonction des recommandations vaccinales. »</p>`;
  app.appendChild(header);
  renderQuestionCard(q, () => {
    if (state.bonusIndex < BONUS_QUESTIONS.length - 1){
      state.bonusIndex++;
      render();
    } else {
      state.screen = "results";
      render();
    }
  }, state.bonusIndex + 1, BONUS_QUESTIONS.length);
  app.insertBefore(header, app.firstChild);
}

function computeScore(){
  const scored = QUESTIONS.concat(state.showBonus ? BONUS_QUESTIONS : []);
  let correct = 0;
  scored.forEach(q => { if (state.answers[q.id] && state.answers[q.id].correct) correct++; });
  return { correct, total: scored.length };
}

async function submitToSheet(payload){
  if (!SHEET_ENDPOINT || SHEET_ENDPOINT.indexOf("COLLER_ICI") !== -1) return;
  try {
    await fetch(SHEET_ENDPOINT, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    });
  } catch (e) {
    // Échec silencieux : on garde une copie locale ci-dessous.
    console.error("Envoi Google Sheet impossible :", e);
  }
}

function renderResults(){
  const { correct, total } = computeScore();
  const payload = {
    date: new Date().toISOString(),
    demo: state.demo,
    score: `${correct}/${total}`,
    reponses: state.answers
  };

  try {
    const key = "quiz_femme_vaccination_reponses";
    const prev = JSON.parse(localStorage.getItem(key) || "[]");
    prev.push(payload);
    localStorage.setItem(key, JSON.stringify(prev));
  } catch(e){ /* stockage local indisponible, on continue */ }

  submitToSheet(payload);

  app.innerHTML = `
    <h1>Merci d'avoir participé !</h1>
    <div class="card center">
      <p class="muted">Votre score</p>
      <div class="score-big">${correct} / ${total}</div>
      <p class="muted">Rendez-vous au stand du CVI pour toute question sur votre vaccination.</p>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn btn-ghost" id="restart">Recommencer</button>
    </div>
    <p class="footer-note">Centre de Vaccination Internationale — Mairie de Toulouse</p>
  `;
  document.getElementById("restart").onclick = () => {
    state = { screen: "intro", demo: {}, answers: {}, shuffles: {}, qIndex: 0, bonusIndex: 0, showBonus:false };
    render();
  };
}

/* ---------- Mode affiche / QR code ---------- */
/* Ouvrir la page avec ?poster=1 pour générer l'affiche à imprimer avec le QR code. */
function renderPoster(){
  const url = location.origin + location.pathname;
  app.innerHTML = `
    <div class="poster">
      <p class="eyebrow">23 septembre — Jardin du Grand Rond, Toulouse</p>
      <h1>Femmes et vaccination<br>Testez vos connaissances</h1>
      <div id="qrcode"></div>
      <p class="muted">Scannez ce QR code pour répondre au quiz</p>
      <div class="row no-print" style="justify-content:center; gap:12px;">
        <button class="btn" id="downloadQr">Télécharger le QR (PNG)</button>
        <button class="btn btn-ghost" id="print">Imprimer l'affiche</button>
      </div>
      <p class="muted no-print" style="margin-top:14px; font-size:13px;">Lien encodé : ${url}</p>
    </div>
  `;
  new QRCode(document.getElementById("qrcode"), {
    text: url,
    width: 220,
    height: 220,
    colorDark: "#0F3D36",
    colorLight: "#ffffff"
  });
  document.getElementById("print").onclick = () => window.print();
  document.getElementById("downloadQr").onclick = () => {
    const canvas = document.querySelector("#qrcode canvas");
    if (!canvas) return;
    const link = document.createElement("a");
    link.download = "qr-quiz-femme-vaccination.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  };
}

/* ---------- Démarrage ---------- */
const params = new URLSearchParams(location.search);
if (params.get("poster") === "1"){
  state.screen = "poster";
}
render();
</script>
